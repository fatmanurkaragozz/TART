name: "✨ Özellik Talebi / Feature Request"
description: "Yeni bir fikir ya da iyileştirme önerin. / Suggest a new idea or improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Öneriniz için teşekkürler! / Thanks for the suggestion!
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivasyon / Problem / Motivation"
      description: "Bu istek hangi ihtiyaçtan doğuyor? / What problem does this solve?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Önerilen Çözüm / Proposed Solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Değerlendirilen Alternatifler / Alternatives Considered"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Ek Bağlam / Additional Context"
    validations:
      required: false
